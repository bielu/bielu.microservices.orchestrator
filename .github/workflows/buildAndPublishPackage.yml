name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull request: build the NuGet packages for validation, publish nothing.
  ci:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/ciNoSchema.yml@main
    with:
      suffix: "pr"

  # Pull request: require a changeset so the version bump + changelog are recorded.
  changeset-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a changeset
        run: |
          # Files added by this PR under .changeset/, excluding README/config. A directory pathspec
          # is used deliberately: the git glob '.changeset/**/*.md' does NOT match top-level files
          # like '.changeset/foo.md' (its '**/' requires an intermediate directory).
          ADDED=$(git diff --diff-filter=A --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            -- .changeset \
            | { grep -E '\.changeset/.+\.md$' || true; } \
            | { grep -vE '/(README|config)\.' || true; })
          if [ -z "$ADDED" ]; then
            echo "::error::No changeset found in this PR. Run 'npx changeset' to describe your change, or 'npx changeset add --empty' for chore-only PRs."
            exit 1
          fi
          echo "Found changeset(s):"; echo "$ADDED"

  # Pull request: whitespace/charset formatting must match .editorconfig.
  format-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify formatting
        run: dotnet format whitespace --verify-no-changes src/Bielu.Microservices.Orchestrator.slnx

  # Push to main: consume changesets into a "Version Packages" PR. While changesets are pending it
  # (re)opens that PR; once it is merged and the changesets are gone, hasChangesets becomes false and
  # the release jobs below take over.
  version:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/versionChangeset.yml@main
    with:
      working-directory: .

  # Version PR merged (no changesets left): publish the stable NuGet packages at the version the
  # Version PR committed. Idempotent (NuGet --skip-duplicate), so re-running on later non-changeset
  # pushes is a safe no-op.
  releaseStable:
    needs: version
    if: github.event_name == 'push' && needs.version.outputs.hasChangesets == 'false'
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/release.yml@main
    # release.yml's publish-npm job unconditionally declares `id-token: write` at the job level
    # (even though we set publish-npm: false); GitHub checks that statically against the caller's
    # grant regardless of the job's runtime `if`, so it must be granted here too.
    permissions:
      contents: read
      id-token: write
    with:
      generate-schema: false
      publish-npm: false
    secrets:
      NUGET_APIKEY: ${{ secrets.NUGET_APIKEY }}

  # Record-keeping: tag + GitHub Release for the shared NuGet version. Release notes are the
  # version's section of CHANGELOG.md (written by changesets in the Version Packages PR); versions
  # with a prerelease suffix are marked as GitHub prereleases. (Created with GITHUB_TOKEN, so it
  # does not itself trigger the `release` job — publishing is done by releaseStable above.)
  tagRelease:
    needs: version
    if: github.event_name == 'push' && needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create GitHub Release for the shared NuGet version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX=$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' version.props)
          SUFFIX=$(grep -oPm1 '(?<=<VersionSuffix>)[^<]+' version.props || true)
          VERSION="$PREFIX"; [ -n "$SUFFIX" ] && VERSION="$PREFIX-$SUFFIX"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to tag."
            exit 0
          fi
          node scripts/release-notes.mjs > release-notes.md
          PRERELEASE_FLAG=""; [ -n "$SUFFIX" ] && PRERELEASE_FLAG="--prerelease"
          echo "Creating release v$VERSION $PRERELEASE_FLAG"
          gh release create "v$VERSION" --title "v$VERSION" \
            --notes-file release-notes.md $PRERELEASE_FLAG

  # Did this push change anything that ends up in a package? A docs, test, CI or changeset-only push
  # while changesets are pending would otherwise publish a beta identical to the previous one. The
  # beta below only runs when this says yes (manual dispatch always runs it).
  codeChanged:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect shipped-code changes
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Fail open: no usable base (manual dispatch, new branch, force push) counts as changed.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No usable base commit; treating as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Shipped code = anything under src/ (except the examples, tests and markdown) plus the
          # shared build/package inputs. Docs, workflows and .changeset do not change a package.
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" \
            | { grep -E '^(src/|version\.props$|global\.json$|package(-lock)?\.json$)' || true; } \
            | { grep -vE '^src/Bielu\.Microservices\.Orchestrator\.(Examples\.[^/]+|Tests)/|\.md$' || true; })
          if [ -n "$CHANGED" ]; then
            echo "Shipped-code changes:"; echo "$CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No shipped-code changes in this push; skipping the beta release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Decide what the in-flight beta should be numbered. The build template would otherwise stamp
  # `-beta.<ticks>` onto the version version.props currently carries — which, right after a stable
  # release, is the version that just shipped, so the beta would sort BELOW it and read as a
  # downgrade. This derives the version from the pending changesets instead, so the first beta after
  # 1.0.0 ships as 1.1.0-beta.<stamp> (or 1.0.1-beta.<stamp> for a patch bump).
  betaVersions:
    needs: [version, codeChanged]
    if: >-
      always() && !cancelled() && needs.codeChanged.result == 'success'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && needs.version.outputs.hasChangesets == 'true'
              && needs.codeChanged.outputs.changed == 'true'))
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/nextVersion.yml@main
    with:
      # The root package.json is the changeset package that carries the shared NuGet version.
      nuget-package: bielu-microservices-orchestrator

  # In-flight prereleases: publish a beta of main while a release is still pending (changesets not yet
  # merged), and on manual dispatch. Skipped on the Version-PR-merge commit so it does not shadow the
  # stable release, and on pushes that change no shipped code (betaVersions is skipped then).
  releaseBeta:
    needs: [version, betaVersions]
    if: >-
      always() && !cancelled() && needs.betaVersions.result == 'success'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && needs.version.outputs.hasChangesets == 'true'))
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/release.yml@main
    permissions:
      contents: read
      id-token: write
    # No `suffix:` here on purpose — the override already carries the `-beta.<stamp>` part, and a
    # suffix would take precedence over it in the build template.
    with:
      nuget-version-override: ${{ needs.betaVersions.outputs.nuget }}
      generate-schema: false
      publish-npm: false
    secrets:
      NUGET_APIKEY: ${{ secrets.NUGET_APIKEY }}

  # Record-keeping for interim betas: surface each published beta build as a GitHub prerelease,
  # using the exact `-beta.<stamp>` version that was packed (release.yml's nuget-version output,
  # which echoes the betaVersions override) and the pending — not yet versioned — changesets as the release notes.
  tagBeta:
    needs: releaseBeta
    if: always() && !cancelled() && needs.releaseBeta.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create GitHub prerelease for the beta build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.releaseBeta.outputs.nuget-version }}"
          if [ -z "$VERSION" ]; then
            echo "No NuGet version output from the beta build; skipping."
            exit 0
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to tag."
            exit 0
          fi
          node scripts/release-notes.mjs --pending > release-notes.md
          echo "Creating prerelease v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" \
            --notes-file release-notes.md --prerelease

  # Manual GitHub Release (escape hatch): build and publish stable packages. Independent of the
  # changeset-driven path above and idempotent, so the two cannot double-publish.
  release:
    if: github.event_name == 'release'
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/release.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      generate-schema: false
      publish-npm: false
    secrets:
      NUGET_APIKEY: ${{ secrets.NUGET_APIKEY }}
